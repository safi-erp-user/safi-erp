name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv git zip unzip autoconf automake libtool libtool-bin pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev m4
    
    - name: Accept Android licenses
      run: |
        yes | sdkmanager --licenses || true
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
    
    - name: Fix Android SDK path for Buildozer
      run: |
        SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
        mkdir -p "$SDK/tools/bin"
        ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
        ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"
        echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
    
    - name: Install buildozer
      run: |
        pip install buildozer cython
    
    - name: Build APK
      run: |
        buildozer android debug
      env:
        DEBIAN_FRONTEND: noninteractive
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safi-erp-apk
        path: |
          bin/*.apk
          **/*.apk
