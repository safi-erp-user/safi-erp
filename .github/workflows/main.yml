name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev m4
    
    - name: Install python-for-android
      run: |
        pip install python-for-android==2025.06.07 cython
    
    - name: Build APK with p4a
      run: |
        p4a apk \
          --private . \
          --package=org.safierp.app \
          --name "Safi ERP" \
          --version 1.0 \
          --requirements=python3,kivy==2.3.1,sqlalchemy,arabic-reshaper,python-bidi,requests \
          --arch=arm64-v8a \
          --android-api=34 \
          --minapi=21 \
          --bootstrap=sdl2 \
          --ndk-api=24 \
          --copy-libs
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safi-erp-apk
        path: |
          *.apk
          **/*.apk
