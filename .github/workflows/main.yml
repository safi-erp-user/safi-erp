name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev m4 expect
    
    - name: Install buildozer
      run: |
        pip install buildozer cython
    
    - name: Build APK
      run: |
        expect -c '
        spawn buildozer android debug
        expect {
            "Accept? (y/N):" { send "y\r"; exp_continue }
            "Accept? (y/N):" { send "y\r"; exp_continue }
            eof
        }
        '
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safi-erp-apk
        path: |
          bin/*.apk
          **/*.apk
