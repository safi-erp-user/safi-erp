name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev expect
    
    - name: Install python-for-android
      run: |
        pip install python-for-android cython
    
    - name: Accept Android licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> $ANDROID_HOME/licenses/android-sdk-license
    
    - name: Build APK with p4a
      run: |
        p4a apk \
          --private . \
          --package=org.safierp.app \
          --name "Safi ERP" \
          --version 1.0 \
          --requirements=python3,kivy==2.3.1,sqlalchemy,arabic-reshaper,python-bidi,requests \
          --arch=arm64-v8a \
          --android-api=30 \
          --minapi=21 \
          --bootstrap=sdl2 \
          --window
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: safi-erp-apk
        path: |
          *.apk
          **/*.apk
